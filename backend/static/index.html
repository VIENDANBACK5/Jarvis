<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Autonomous Agent Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0b0d;
            --bg-secondary: #12141c;
            --bg-tertiary: #1a1d29;
            --border-color: #262a3b;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-color: #3b82f6;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .status-badge { font-size: 12px; padding: 4px 10px; borderRadius: 12px; background: rgba(16, 185, 129, 0.1); color: var(--accent-success); border: 1px solid rgba(16, 185, 129, 0.2); }

        .container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 14px 18px; font-size: 13px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); }
        .file-tree { flex: 1; overflow-y: auto; padding: 12px; font-family: 'Fira Code', monospace; font-size: 13px; }
        .tree-item { padding: 4px 8px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .tree-item:hover { background: var(--bg-tertiary); }

        .main-panel { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); }
        .chat-transcript { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

        .message-bubble { padding: 14px 18px; border-radius: 8px; max-width: 85%; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
        .user-message { background: #1e293b; align-self: flex-end; color: #e2e8f0; border: 1px solid #334155; }
        .agent-message { background: var(--bg-secondary); align-self: flex-start; border: 1px solid var(--border-color); }

        .tool-card { background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 14px; font-family: 'Fira Code', monospace; font-size: 12px; margin: 6px 0; }
        .tool-card-title { font-weight: 600; color: var(--accent-color); margin-bottom: 4px; }
        .tool-card-output { background: var(--bg-primary); padding: 8px; border-radius: 4px; color: var(--text-secondary); max-height: 200px; overflow-y: auto; margin-top: 6px; }

        .composer { padding: 16px 24px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); display: flex; gap: 12px; }
        .composer input { flex: 1; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px 16px; color: var(--text-primary); font-size: 14px; outline: none; }
        .composer button { background: var(--accent-color); color: white; border: none; border-radius: 6px; padding: 0 20px; font-weight: 600; cursor: pointer; }
        .composer button.interrupt { background: var(--accent-danger); }

        /* Permission Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; width: 550px; padding: 24px; }
        .modal-title { font-size: 16px; font-weight: 600; color: var(--accent-warning); margin-bottom: 12px; }
        .modal-body { font-family: 'Fira Code', monospace; font-size: 13px; background: var(--bg-primary); padding: 12px; border-radius: 6px; margin-bottom: 20px; max-height: 250px; overflow-y: auto; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
        .btn-deny { background: var(--accent-danger); color: white; }
        .btn-allow { background: var(--accent-success); color: white; }
        .btn-always { background: var(--accent-color); color: white; }
    </style>
</head>
<body>
    <header>
        <h1>🤖 Jarvis Agent Studio</h1>
        <div class="status-badge" id="conn-status">● Connected</div>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">Workspace Files</div>
            <div class="file-tree" id="file-tree">Loading workspace tree...</div>
        </div>

        <div class="main-panel">
            <div class="chat-transcript" id="chat-transcript">
                <div class="message-bubble agent-message">Hello! I am Jarvis Agent Core. Describe the software engineering task you want me to work on.</div>
            </div>

            <div class="composer">
                <input type="text" id="prompt-input" placeholder="Type your engineering task (e.g. 'Fix login timeout')..." onkeypress="if(event.key==='Enter') sendTask()">
                <button onclick="sendTask()" id="run-btn">Run</button>
                <button onclick="interruptAgent()" class="interrupt" id="interrupt-btn" style="display:none;">Stop</button>
            </div>
        </div>
    </div>

    <!-- Permission Modal -->
    <div class="modal-overlay" id="perm-modal">
        <div class="modal-content">
            <div class="modal-title">⚠️ Permission Requested</div>
            <div class="modal-body" id="perm-details">Tool call requires approval...</div>
            <div class="modal-actions">
                <button class="btn btn-deny" onclick="respondPermission(false, false)">Deny</button>
                <button class="btn btn-allow" onclick="respondPermission(true, false)">Allow Once</button>
                <button class="btn btn-always" onclick="respondPermission(true, true)">Always Allow</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = null;
        let ws = null;
        let activeReqId = null;

        async function initSession() {
            try {
                const res = await fetch("/api/v1/agent/sessions", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({workspace_dir: "."})
                });
                const data = await res.json();
                sessionId = data.session_id;

                connectWebSocket();
                loadTree();
            } catch(e) {
                document.getElementById("conn-status").innerText = "❌ Connection Failed";
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${protocol}//${window.location.host}/api/v1/agent/ws/${sessionId}`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleAgentEvent(data);
            };
        }

        async function loadTree() {
            try {
                const res = await fetch(`/api/v1/agent/sessions/${sessionId}/tree`);
                const data = await res.json();
                const treeEl = document.getElementById("file-tree");
                treeEl.innerHTML = "";
                data.tree.forEach(f => {
                    const div = document.createElement("div");
                    div.className = "tree-item";
                    div.innerText = "📄 " + f;
                    treeEl.appendChild(div);
                });
            } catch(e) {}
        }

        async function sendTask() {
            const input = document.getElementById("prompt-input");
            const text = input.value.trim();
            if (!text || !sessionId) return;

            appendBubble(text, "user");
            input.value = "";

            document.getElementById("run-btn").style.display = "none";
            document.getElementById("interrupt-btn").style.display = "block";

            await fetch(`/api/v1/agent/sessions/${sessionId}/messages`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({text: text})
            });
        }

        async function interruptAgent() {
            if (!sessionId) return;
            await fetch(`/api/v1/agent/sessions/${sessionId}/interrupt`, {method: "POST"});
            document.getElementById("run-btn").style.display = "block";
            document.getElementById("interrupt-btn").style.display = "none";
        }

        function handleAgentEvent(evt) {
            const transcript = document.getElementById("chat-transcript");
            if (evt.event_type === "text_delta") {
                let lastMsg = transcript.lastElementChild;
                if (!lastMsg || !lastMsg.classList.contains("agent-message") || lastMsg.dataset.streaming !== "true") {
                    lastMsg = document.createElement("div");
                    lastMsg.className = "message-bubble agent-message";
                    lastMsg.dataset.streaming = "true";
                    transcript.appendChild(lastMsg);
                }
                lastMsg.innerText += evt.payload.text;
                transcript.scrollTop = transcript.scrollHeight;
            } else if (evt.event_type === "tool_use") {
                const card = document.createElement("div");
                card.className = "tool-card";
                card.id = `tool-${evt.payload.id}`;
                card.innerHTML = `<div class="tool-card-title">● Tool Call: ${evt.payload.name}</div><div>Args: ${JSON.stringify(evt.payload.args)}</div>`;
                transcript.appendChild(card);
                transcript.scrollTop = transcript.scrollHeight;

                // Prompt permission for mutating tools
                if (["write_file", "edit_file", "bash"].includes(evt.payload.name)) {
                    activeReqId = evt.payload.id;
                    document.getElementById("perm-details").innerText = `Tool: ${evt.payload.name}\nArgs: ${JSON.stringify(evt.payload.args, null, 2)}`;
                    document.getElementById("perm-modal").style.display = "flex";
                }
            } else if (evt.event_type === "tool_result") {
                const card = document.getElementById(`tool-${evt.payload.id}`);
                if (card) {
                    const out = document.createElement("div");
                    out.className = "tool-card-output";
                    out.innerText = evt.payload.output;
                    card.appendChild(out);
                }
            } else if (evt.event_type === "turn_complete" || evt.event_type === "interrupted") {
                document.getElementById("run-btn").style.display = "block";
                document.getElementById("interrupt-btn").style.display = "none";
                loadTree();
            }
        }

        async function respondPermission(allowed, always) {
            document.getElementById("perm-modal").style.display = "none";
            if (ws && activeReqId) {
                ws.send(JSON.stringify({
                    type: "permission_response",
                    request_id: activeReqId,
                    allowed: allowed,
                    always: always
                }));
            }
        }

        window.onload = initSession;
    </script>
</body>
</html>
